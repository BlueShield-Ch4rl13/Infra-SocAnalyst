# Cada semana: las acciones de GitHub de la CI, que van fijadas por SHA.
# Las imágenes de compose/ no: Dependabot solo lee ficheros que se llamen
# docker-compose.yml o compose.yml, y aquí son soar-stack.yml y
# telemetry-stack.yml (fallaba cada lunes con "No Dockerfiles nor Kubernetes
# YAML found"). La de Elasticsearch la vigila el resumen semanal de Discord.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups: {acciones: {patterns: ["*"]}}
